
# ==========================================
# POSTGRESQL - RDS CATALOGO
# ==========================================

spring.datasource.url=jdbc:postgresql://mesatech-rds-catalogo.cmgw8ccnbjks.us-east-1.rds.amazonaws.com:5432/mesatech_catalogo
spring.datasource.username=admin_catalogo
spring.datasource.password=Conejos20
spring.datasource.driver-class-name=org.postgresql.Driver

# Persistencia JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# ==========================================
# RABBITMQ - PUBLICADOR CATALOGO
# ==========================================

# Conexion al servidor RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.virtual-host=mesatech
spring.rabbitmq.connection-timeout=5s

# Confirmaciones de publicacion
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

# Recursos de mensajeria MesaTech
app.rabbitmq.exchange=catalogo.exchange
app.rabbitmq.routing-key=categoria.creada