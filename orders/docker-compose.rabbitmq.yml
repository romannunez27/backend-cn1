services:
  rabbitmq:
    image: rabbitmq:4.1-management
    container_name: mesatech-rabbitmq
    hostname: mesatech-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

    restart: unless-stopped

volumes:
  rabbitmq_data:
