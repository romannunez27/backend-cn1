services:
  orders:
    image: mesatech-orders:latest
    container_name: mesatech-orders
    restart: unless-stopped

    ports:
      - "8082:8082"

    env_file:
      - .env

    environment:
      SERVER_PORT: 8082

    networks:
      - mesatech-network

networks:
  mesatech-network:
    driver: bridge
