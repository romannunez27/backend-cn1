# PostgreSQL - Desarrollo local
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/mesatech_orders}
spring.datasource.username=${DB_USERNAME:orders_user}
spring.datasource.password=${DB_PASSWORD:local_dev_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update


# ==========================================
# RABBITMQ CLOUD
# ==========================================

spring.rabbitmq.host=${RABBITMQ_HOST:100.31.109.219}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=$orders_consumer
spring.rabbitmq.password=$orders_consumer
spring.rabbitmq.virtual-host=mesatech

# Cola del consumidor
app.rabbitmq.queue=solicitudes.catalogo.queue

# Confirmacion de mensajes
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=true

