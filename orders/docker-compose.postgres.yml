services:
  postgres:
    image: postgres:16
    container_name: mesatech-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: mesatech_orders
      POSTGRES_USER: orders_user
      POSTGRES_PASSWORD: local_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
