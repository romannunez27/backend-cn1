spring.application.name=bff
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# JWT de la API.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_TENANT_ID}/v2.0
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_API_AUDIENCE}
# Microsoft Graph:
azure.tenant-id=${AZURE_TENANT_ID}
azure.client-id=${AZURE_GRAPH_CLIENT_ID}
azure.client-secret=${AZURE_GRAPH_CLIENT_SECRET}
azure.operators-group-id=${AZURE_OPERATORS_GROUP_ID}
