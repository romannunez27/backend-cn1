services:
  bff:
    image: mesatech-bff:latest
    container_name: mesatech-bff
    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env

    environment:
      SERVER_PORT: 8080
      ORDERS_URL: ${ORDERS_URL}
      CATALOG_URL: ${CATALOG_URL}

    networks:
      - mesatech-network

networks:
  mesatech-network:
    driver: bridge
